<!doctype html>
<html lang="id">
  <head>

    <title>SIAP SPANJU - Sistem Integrasi Aplikasi Pembinaan Siswa</title>

    <meta name="theme-color" content="#0f172a" />
    
    <!-- Mobile & PWA App Capabilities -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SIAP SPANJU" />

    <!-- Icons and Manifest -->
    <link rel="manifest" href="/manifest.json" />

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SIAP SPANJU ServiceWorker Registered:', reg.scope))
            .catch(err => console.error('SIAP SPANJU ServiceWorker Registration failed:', err));
        });
      }
    </script>
